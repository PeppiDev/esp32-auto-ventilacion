# ==========================================================
# Mosquitto en LINUX — copiar a /etc/mosquitto/conf.d/ventilacion.conf
# En Fedora/Arch, agregar antes "include_dir /etc/mosquitto/conf.d"
# al final de /etc/mosquitto/mosquitto.conf (ver docs/mosquitto-mqtt.md).
# ==========================================================

# Escucha en la red local (solo red privada del laboratorio; NO abrir en el router)
listener 1883 0.0.0.0

# Sin acceso anónimo: todo cliente debe autenticarse
allow_anonymous false
password_file /etc/mosquitto/passwd

# Mínimo privilegio (mismo archivo que en Windows: mosquitto/acl)
acl_file /etc/mosquitto/acl

# Registro de eventos -> journald (journalctl -u mosquitto)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ----------------------------------------------------------
# FASE 2 (opcional): MQTT sobre TLS en 8883 (ver docs/mosquitto-mqtt.md §5)
# Al migrar, comentar el listener 1883.
# ----------------------------------------------------------
#listener 8883 0.0.0.0
#cafile   /etc/mosquitto/certs/ca.crt
#certfile /etc/mosquitto/certs/server.crt
#keyfile  /etc/mosquitto/certs/server.key
#tls_version tlsv1.2
